# CI: lint + compile check + tests on every push to main and every pull request.
# The test job runs exactly `make ci`; the lint job runs the pre-commit hygiene hooks.
# Run `make ci && pre-commit run --all-files` locally first.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (pre-commit hooks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Every hook in .pre-commit-config.yaml (gdformat, gdlint, shellcheck, ruff, hygiene).
      - uses: pre-commit/action@v3.0.1

  test:
    name: make ci (Godot headless)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read pinned Godot version
        id: godot
        run: echo "version=$(cat .godot-version)" >> "$GITHUB_OUTPUT"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ steps.godot.outputs.version }}
          use-dotnet: false
          include-templates: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install gdtoolkit (same pin as pre-commit and setup.sh)
        run: pip install "gdtoolkit==4.5.0"
      - name: make ci
        run: make ci
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: reports/
          if-no-files-found: ignore
